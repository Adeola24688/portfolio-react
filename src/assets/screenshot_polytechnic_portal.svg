<svg width="1170" height="780" viewBox="0 0 1170 780" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1170" height="780" fill="#eef7f4"/>
  <rect width="234" height="780" fill="#244493"/>
  <rect x="92" y="64" width="64" height="64" fill="#2f5b87"/>
  <circle cx="124" cy="90" r="10" fill="none" stroke="#dce9f8" stroke-width="2"/>
  <path d="M124 75L137 81V91C137 100 132 107 124 111C116 107 111 100 111 91V81L124 75Z" stroke="#dce9f8" stroke-width="2" fill="none"/>
  <text x="124" y="108" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="7" font-weight="700">POLYTECHNIC</text>
  <text x="117" y="170" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="19" font-weight="800">POLYTECHNIC</text>

  <g filter="url(#softShadow)">
    <rect x="20" y="214" width="194" height="118" rx="8" fill="#304f9f"/>
    <rect x="20" y="214" width="4" height="118" rx="2" fill="#10b981"/>
    <text x="36" y="238" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="800">Important information</text>
    <text x="36" y="261" fill="#ffffff" font-family="Arial, sans-serif" font-size="10">You are to log in with your registered</text>
    <text x="36" y="278" fill="#ffffff" font-family="Arial, sans-serif" font-size="10">email and password. New students</text>
    <text x="36" y="295" fill="#ffffff" font-family="Arial, sans-serif" font-size="10">should apply through admission portal.</text>
    <rect x="36" y="306" width="64" height="22" rx="3" fill="#08a80b"/>
    <text x="68" y="321" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="10" font-weight="700">Click here!</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="20" y="354" width="194" height="128" rx="8" fill="#304f9f"/>
    <rect x="20" y="354" width="4" height="128" rx="2" fill="#f59e0b"/>
    <text x="36" y="379" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="800">Important information for old students</text>
    <text x="36" y="404" fill="#ffffff" font-family="Arial, sans-serif" font-size="10">Old students should register on the</text>
    <text x="36" y="421" fill="#ffffff" font-family="Arial, sans-serif" font-size="10">admission portal before continuing</text>
    <text x="36" y="438" fill="#ffffff" font-family="Arial, sans-serif" font-size="10">course registration and profiling.</text>
    <rect x="36" y="452" width="64" height="22" rx="3" fill="#08a80b"/>
    <text x="68" y="467" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="10" font-weight="700">Click here!</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="20" y="510" width="194" height="84" rx="8" fill="#304f9f"/>
    <rect x="20" y="510" width="4" height="84" rx="2" fill="#ef4444"/>
    <text x="36" y="534" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="800">Course Registration</text>
    <text x="36" y="558" fill="#ffffff" font-family="Arial, sans-serif" font-size="10">Login to your account, provide a valid</text>
    <text x="36" y="575" fill="#ffffff" font-family="Arial, sans-serif" font-size="10">PIN and follow other processes.</text>
  </g>

  <g filter="url(#cardShadow)">
    <rect x="555" y="178" width="292" height="360" rx="14" fill="#ffffff"/>
    <rect x="680" y="214" width="44" height="44" fill="#2f5b87"/>
    <circle cx="702" cy="232" r="7" fill="none" stroke="#dce9f8" stroke-width="1.5"/>
    <path d="M702 221L711 225V232C711 239 708 244 702 247C696 244 693 239 693 232V225L702 221Z" stroke="#dce9f8" stroke-width="1.5" fill="none"/>
    <text x="702" y="249" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="5.5" font-weight="700">POLYTECHNIC</text>
    <text x="701" y="292" text-anchor="middle" fill="#244493" font-family="Arial, sans-serif" font-size="20" font-weight="800">STUDENT PORTAL</text>
    <text x="701" y="315" text-anchor="middle" fill="#60708d" font-family="Arial, sans-serif" font-size="11">Sign in to your account</text>

    <text x="575" y="355" fill="#35415d" font-family="Arial, sans-serif" font-size="11" font-weight="700">Email Address</text>
    <rect x="575" y="368" width="252" height="38" rx="6" fill="#ffffff" stroke="#dbe4f0"/>
    <text x="585" y="392" fill="#7b7f8a" font-family="Arial, sans-serif" font-size="12">Enter your email</text>

    <text x="575" y="438" fill="#35415d" font-family="Arial, sans-serif" font-size="11" font-weight="700">Password</text>
    <rect x="575" y="451" width="252" height="38" rx="6" fill="#ffffff" stroke="#dbe4f0"/>
    <text x="585" y="475" fill="#7b7f8a" font-family="Arial, sans-serif" font-size="12">Enter your password</text>
    <circle cx="807" cy="470" r="4" fill="#111111"/>

    <rect x="575" y="504" width="252" height="38" rx="6" fill="#2849bf"/>
    <text x="701" y="528" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="12" font-weight="800">Login to your account</text>
    <text x="701" y="566" text-anchor="middle" fill="#111111" font-family="Arial, sans-serif" font-size="9" font-weight="700">To secure your account, always log out once you are done!</text>
    <text x="575" y="598" fill="#00820c" font-family="Arial, sans-serif" font-size="10" font-weight="800">Forgot password?</text>
    <text x="827" y="598" text-anchor="end" fill="#00820c" font-family="Arial, sans-serif" font-size="10" font-weight="800">New Student Registration</text>
  </g>

  <defs>
    <filter id="softShadow" x="0" y="194" width="244" height="420" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#10245c" flood-opacity="0.18"/>
    </filter>
    <filter id="cardShadow" x="515" y="138" width="372" height="440" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#1f2f46" flood-opacity="0.16"/>
    </filter>
  </defs>
</svg>
